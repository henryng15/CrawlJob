[project]
name = "internship-sheet-sync"
version = "0.1.0"
description = "Sync software-engineering internship trackers to one Google Sheet"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.160",
  "google-auth>=2.38",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Named rather than discovered. apps_script/ holds the Apps Script halves of this
# tool, which are not Python; left to auto-discovery setuptools sees two top-level
# packages in a flat layout and refuses to build at all.
[tool.setuptools]
packages = ["job_sync"]

# The recruiter company list, ATS board shortlist, and optional feed registry ship with the code.
# Without this the wheel carries only .py files, and both features go quiet on a
# runner while every test still passes locally off the checkout.
[tool.setuptools.package-data]
job_sync = ["data/*.txt", "data/*.json", "data/*.toml"]

[project.scripts]
internship-sync = "job_sync.main:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
