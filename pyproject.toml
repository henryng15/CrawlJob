[project]
name = "internship-sheet-sync"
version = "0.1.0"
description = "Sync software-engineering internship trackers to one Google Sheet"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.160",
  "google-auth>=2.38",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
internship-sync = "job_sync.main:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
