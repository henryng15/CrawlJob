name: Sync internships to Google Sheet

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Replace every row instead of only adding the new ones"
        type: boolean
        default: false
      audit_app:
        description: "Report what is wrong with the App tab, and sync nothing"
        type: boolean
        default: false

# There is no schedule here on purpose. GitHub delivered its cron firings a median
# 25 minutes late over 21-27 August 2026 — p90 74, worst 106 — which a 45-minute
# cadence cannot absorb, since the delay is over half the interval and the runs
# bunch up behind each other. It dropped almost nothing (52 of 54); it was simply
# always late.
#
# The clock now lives outside GitHub, in the four cron-job.org jobs that
# scripts/setup_cron_job_org.sh creates. They fire this workflow through the
# dispatch API every 45 minutes from 09:00 to 21:00 ET, seventeen times a day, and
# a dispatch starts at once: the one measured on 27 August was accepted at
# 15:50:11Z and running by 15:50:12Z.
#
# Two things follow from the clock being elsewhere. The schedule is stated in
# America/New_York rather than UTC, so nothing needs shifting by hand when EST
# starts on 1 November 2026. And if that scheduler stops — a lapsed token is the
# likely way — nothing here notices, because there is no longer a second clock to
# fall back on.

permissions:
  contents: read

# Two runs must never write the sheet at once. Forty-five minutes apart with a run
# that takes two (median 130s over 60 runs, worst 369s) leaves no room to collide on
# its own, but the external scheduler can fire while somebody is already running one
# by hand, and both would be rewriting the same rows. Queue rather than cancel: a
# cancelled run could stop halfway through a rewrite. Queued time is not billed.
concurrency:
  group: sheet-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A run takes about two minutes: median 130s across the 60 runs to 27 August
    # 2026, p90 251s, worst 369s. The default ceiling is six hours, so one hung run
    # would eat 12% of the month's 3,000 minutes before Actions gave up on it.
    #
    # Still 15 after the sweep was parallelised per host. A run is back to about
    # four minutes — a 122s crawl and sheet write plus a 94s sweep, measured
    # 2026-10-18 — so this is roughly a factor of four of headroom, and it is left
    # where it is rather than tightened because the ceiling exists to catch a hung
    # host, not to police the normal run. The sweep is now bounded by the depth of
    # a queue rather than by the size of a host, so the growth that took the run
    # from 3 minutes to 10 over a month no longer compounds the same way: the
    # jobright bucket has to pass 600 links before its queues deepen at all.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      # --scheduled, which held the crawl to the ET window, is gone with the cron
      # that needed it: every run now arrives either from the external scheduler,
      # which only fires inside the window, or from a person asking for one.
      #
      # Every run sweeps links again, as it always did. It briefly did not: between
      # 2026-10-18 and 10-19 this step passed --skip-link-check on fifteen of the
      # seventeen runs, because a serial sweep of jobright.ai's 507 links had taken
      # the run to 10m26s and spent the month's 3,000 Actions minutes on the 17th.
      # That gate is gone because the sweep itself was fixed: liveness.py now deals
      # a host that big across six paced queues, measured at 94s against 527s, so
      # the saving no longer has to come out of how often the sheet is checked.
      - run: >-
          internship-sync
          ${{ inputs.rebuild && '--rebuild' || '' }}
          ${{ inputs.audit_app && '--audit-app' || '' }}
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
          # No secret needed unless the tab was renamed: an unset secret arrives as
          # an empty string, and the command falls back to "App" on empty.
          GOOGLE_SHEET_APP_TAB: ${{ secrets.GOOGLE_SHEET_APP_TAB }}
          GOOGLE_SHEET_ALUMNI_TAB: ${{ secrets.GOOGLE_SHEET_ALUMNI_TAB }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Optional: these feeds are skipped when their secrets are empty.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
