name: Sync internships to Google Sheet

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Replace every row instead of only adding the new ones"
        type: boolean
        default: false
      audit_app:
        description: "Report what is wrong with the App tab, and sync nothing"
        type: boolean
        default: false
      link_check:
        description: "Run the liveness sweep on this run even outside its two daily slots"
        type: boolean
        default: false

# There is no schedule here on purpose. GitHub delivered its cron firings a median
# 25 minutes late over 21-27 August 2026 — p90 74, worst 106 — which a 45-minute
# cadence cannot absorb, since the delay is over half the interval and the runs
# bunch up behind each other. It dropped almost nothing (52 of 54); it was simply
# always late.
#
# The clock now lives outside GitHub, in the four cron-job.org jobs that
# scripts/setup_cron_job_org.sh creates. They fire this workflow through the
# dispatch API every 45 minutes from 09:00 to 21:00 ET, seventeen times a day, and
# a dispatch starts at once: the one measured on 27 August was accepted at
# 15:50:11Z and running by 15:50:12Z.
#
# Two things follow from the clock being elsewhere. The schedule is stated in
# America/New_York rather than UTC, so nothing needs shifting by hand when EST
# starts on 1 November 2026. And if that scheduler stops — a lapsed token is the
# likely way — nothing here notices, because there is no longer a second clock to
# fall back on.

permissions:
  contents: read

# Two runs must never write the sheet at once. Forty-five minutes apart with a run
# that takes two (median 130s over 60 runs, worst 369s) leaves no room to collide on
# its own, but the external scheduler can fire while somebody is already running one
# by hand, and both would be rewriting the same rows. Queue rather than cancel: a
# cancelled run could stop halfway through a rewrite. Queued time is not billed.
concurrency:
  group: sheet-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A run takes about two minutes: median 130s across the 60 runs to 27 August
    # 2026, p90 251s, worst 369s. The default ceiling is six hours, so one hung run
    # would eat 12% of the month's 3,000 minutes before Actions gave up on it.
    #
    # Left at 15 deliberately now that two runs a day sweep links and the rest do
    # not. An unswept run is back to about two minutes; a swept one was 10m26s on
    # 2026-10-17 and grows with the jobright bucket at roughly 16s a day, so it
    # reaches this ceiling around mid-November 2026 and starts failing. That is the
    # intended alarm rather than an oversight: raising the ceiling would hide a
    # sweep that has outgrown being serial, and the fix at that point is to stop
    # probing one host one link at a time, not to wait longer for it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      # --scheduled, which held the crawl to the ET window, is gone with the cron
      # that needed it: every run now arrives either from the external scheduler,
      # which only fires inside the window, or from a person asking for one.
      #
      # --skip-link-check on fifteen of the seventeen runs, because the liveness
      # sweep is the only step here that grew without anyone changing it. It costs
      # one request per unsettled row, and those requests are deliberately serial
      # within a host, so the run is as long as its largest host bucket. On
      # 2026-10-17 that bucket was jobright.ai with 507 of the 1,044 swept links:
      # at a measured 0.46s per check plus the 0.4s pacing, 7.3 minutes of the
      # 10m26s run, against 0.6 minutes for the next host down. Every jobright
      # posting the crawl adds is another 0.86s on all seventeen runs, which is
      # what walked a 3-minute run in mid-September up to 10 by mid-October and
      # spent the month's 3,000 Actions minutes on the 17th.
      #
      # 10:30 and 16:30 ET are the two slots that sweep. They are picked because
      # the 45-minute cadence puts exactly one firing in each of those hours — 09,
      # 12, 15 and 18 hold two — so the gate gives two sweeps a day rather than
      # four, and a mid-hour slot leaves 29 minutes of slack for a late dispatch.
      #
      # Nothing in job_sync changed. --skip-link-check is main.py's own flag and
      # a swept run reaches exactly the verdicts it always did; what the gate
      # trades away is removal latency. A posting the board has taken down can now
      # sit in the sheet for up to six hours, which is what the Expired checkbox
      # is for. Pass link_check to force a sweep on a run in between.
      - name: Sync the sheet
        run: |
          set -euo pipefail
          hour=$(TZ=America/New_York date +%H)
          sweep="--skip-link-check"
          if [ "${{ inputs.link_check }}" = "true" ]; then
            sweep=""
            echo "Liveness sweep: on, asked for by hand."
          else
            case "$hour" in
              10|16) sweep="" ;;
            esac
            echo "ET hour ${hour}; liveness sweep: $([ -z "$sweep" ] && echo on || echo off)."
          fi
          internship-sync \
            $sweep \
            ${{ inputs.rebuild && '--rebuild' || '' }} \
            ${{ inputs.audit_app && '--audit-app' || '' }}
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
          # No secret needed unless the tab was renamed: an unset secret arrives as
          # an empty string, and the command falls back to "App" on empty.
          GOOGLE_SHEET_APP_TAB: ${{ secrets.GOOGLE_SHEET_APP_TAB }}
          GOOGLE_SHEET_ALUMNI_TAB: ${{ secrets.GOOGLE_SHEET_ALUMNI_TAB }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Optional: these feeds are skipped when their secrets are empty.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
